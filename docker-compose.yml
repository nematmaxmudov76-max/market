services:
  # 1. PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: market_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - market_net

  # 2. Redis
  redis:
    image: redis:7-alpine
    container_name: market_redis
    restart: always
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - market_net

  # 3. FastAPI
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: market_fastapi
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - market_net

  # 4. Celery Worker
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: market_celery_worker
    restart: always
    command: celery -A app.celery worker --loglevel=info
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - market_net

  # 5. Celery Beat
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: market_celery_beat
    restart: always
    command: celery -A app.celery beat --loglevel=info
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - market_net

networks:
  market_net:
    driver: bridge

volumes:
  postgres_data: