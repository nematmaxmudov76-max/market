<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bildirishnomalar — Market (Notifications)</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .notif-card {
      background: white;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 18px 24px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: var(--transition);
      position: relative;
    }
    .notif-card.unread {
      border-left: 5px solid var(--primary);
      background: #faf7ff;
    }
    .notif-card:hover {
      box-shadow: var(--shadow-sm);
    }
  </style>
</head>
<body>

  <!-- TOP STRIP -->
  <div class="page-header-strip">
    <div class="container page-header-nav">
      <div class="nav-links-row">
        <a href="home-page.html" class="badge-link">🏠 Bosh sahifa</a>
        <a href="account-page.html" class="badge-link">👤 Kabinet</a>
        <a href="bucket-page.html" class="badge-link">🛒 Savatcha</a>
        <a href="ordered-product-page.html" class="badge-link">📦 Buyurtmalar</a>
        <a href="courier-page.html" class="badge-link courier-btn">⚡ Kuryer portali</a>
      </div>
      <div>
        <span style="font-size: 13px; color: var(--text-muted);">
          🔔 Barcha yangiliklar va buyurtma holatlari
        </span>
      </div>
    </div>
  </div>

  <!-- MAIN CONTAINER -->
  <main class="container" style="flex: 1; margin-top: 10px; max-width: 860px;">

    <div style="background: white; border-radius: 16px; padding: 24px; border: 1px solid var(--border-color); margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
      <div>
        <h1 style="font-size: 24px; font-weight: 800;">
          Bildirishnomalar (Notifications)
        </h1>
        <p style="font-size: 14px; color: var(--text-muted); margin-top: 4px;" id="notif-count-text">
          Yuklanmoqda...
        </p>
      </div>

      <button class="badge-link" onclick="markAllAsRead()">
        ✓ Barchasini o'qilgan deb belgilash
      </button>
    </div>

    <!-- NOTIFICATIONS LIST (Model: Notification, User_Notification) -->
    <!-- BACKEND: GET /api/v1/common/notifications -->
    <div id="notifications-container">
      <!-- JS orqali generatsiya qilinadi -->
    </div>

  </main>

  <!-- SKRIPTLAR -->
  <script src="js/mock-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>

  <script>
    async function loadNotifications() {
      const notifs = await window.marketAPI.getNotifications();
      const container = document.getElementById('notifications-container');
      const unreadCount = notifs.filter(n => !n.readAt).length;

      document.getElementById('notif-count-text').textContent = unreadCount > 0 
        ? `${unreadCount} ta o'qilmagan xabarnoma mavjud` 
        : "Barcha xabarnomalar o'qilgan";

      container.innerHTML = notifs.map(n => {
        const isUnread = !n.readAt;

        return `
          <div class="notif-card ${isUnread ? 'unread' : ''}" onclick="handleNotifClick(${n.id}, '${n.link || '#'}')">
            <div>
              <div style="display: flex; align-items: center; gap: 8px;">
                <strong style="font-size: 15px; color: var(--text-main);">${n.title}</strong>
                ${isUnread ? '<span style="width: 8px; height: 8px; border-radius: 50%; background: var(--primary);"></span>' : ''}
              </div>
              <p style="font-size: 13px; color: var(--text-muted); margin: 6px 0;">
                ${n.message}
              </p>
              <small style="color: var(--text-light); font-size: 11px;">
                🗓 ${n.createdAt}
              </small>
            </div>

            <div>
              <a href="${n.link || '#'}" class="badge-link active" style="font-size: 12px; padding: 6px 14px;">
                O'tish →
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    async function handleNotifClick(id, link) {
      await window.marketAPI.markNotificationRead(id);
      loadNotifications();
      if (link && link !== '#') {
        window.location.href = link;
      }
    }

    async function markAllAsRead() {
      const notifs = await window.marketAPI.getNotifications();
      notifs.forEach(n => { n.readAt = new Date().toISOString(); });
      localStorage.setItem("market_notifications", JSON.stringify(notifs));
      showToast("Barcha bildirishnomalar o'qilgan deb belgilandi", 'info');
      loadNotifications();
    }

    document.addEventListener('DOMContentLoaded', loadNotifications);
  </script>
</body>
</html>
